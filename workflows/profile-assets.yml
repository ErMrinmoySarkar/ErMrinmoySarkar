# Generates live profile assets for ErMrinnmoySarkar:
#   github-stats.svg, github-streak.svg, github-languages.svg, github-fish.svg
# and publishes them to the "output" branch, where the README reads them.
#
# One workflow (not two) on purpose: the stats cards and the fish both need the
# same contribution data, and two workflows publishing to the same branch would
# overwrite each other's files.
#
# Needs no secrets: the built-in GITHUB_TOKEN is enough to read public data.

name: Profile Assets

on:
  # Once a day is plenty for a profile page.
  schedule:
    - cron: "23 2 * * *"
  # Run it by hand from the Actions tab.
  workflow_dispatch:
  # Re-run when the generator or this workflow changes (not on every commit).
  push:
    branches: [main, master]
    paths:
      - scripts/generate_profile_assets.py
      - .github/workflows/profile-assets.yml

# Least privilege: only needs to push the "output" branch.
permissions:
  contents: write

concurrency:
  group: profile-assets
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Generate stats and fish animation
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROFILE_USER: ${{ github.repository_owner }}
          OUTPUT_DIR: dist
        run: python3 scripts/generate_profile_assets.py

      - name: Publish to the output branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cd dist
          git init -q
          git checkout -q -b output
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "chore: refresh profile assets"
          # Force-push a single orphan commit so the branch never grows.
          # Pushes made with GITHUB_TOKEN do not trigger new workflow runs, so no loop.
          git push --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" output
